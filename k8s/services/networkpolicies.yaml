# Frontend: only accepts ingress from nginx-ingress namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-netpol
  namespace: app
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: user-service
      ports: [{port: 3001}]
    - to:
        - podSelector:
            matchLabels:
              app: product-service
      ports: [{port: 3002}]
    - to:
        - podSelector:
            matchLabels:
              app: order-service
      ports: [{port: 3003}]
    - ports: [{port: 53, protocol: UDP}]
---
# Backend services: only accept traffic from frontend + ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-netpol
  namespace: app
spec:
  podSelector:
    matchLabels:
      tier: backend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              tier: backend   # inter-service (order→product)
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports: [{port: 5432}]
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports: [{port: 6379}]
    - ports: [{port: 53, protocol: UDP}, {port: 443}]
---
# Database: only backend can connect
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-netpol
  namespace: app
spec:
  podSelector:
    matchLabels:
      tier: database
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: backend
      ports: [{port: 5432}]
