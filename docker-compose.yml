version: '3.9'

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

services:

  postgres:
    image: postgres:16-alpine
    container_name: aks3tier-postgres
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks: [app-network]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "appuser", "-d", "appdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: aks3tier-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks: [app-network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  user-service:
    build:
      context: ./services/user-service
      target: production
    container_name: aks3tier-user
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppassword
      REDIS_HOST: redis
      NODE_ENV: development
      JWT_SECRET: dev-secret-change-in-prod
    ports:
      - "3001:3001"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [app-network]
    restart: unless-stopped

  product-service:
    build:
      context: ./services/product-service
      target: production
    container_name: aks3tier-product
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppassword
      REDIS_HOST: redis
      NODE_ENV: development
    ports:
      - "3002:3002"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [app-network]
    restart: unless-stopped

  order-service:
    build:
      context: ./services/order-service
      target: production
    container_name: aks3tier-order
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: apppassword
      REDIS_HOST: redis
      PRODUCT_SERVICE_URL: http://product-service:3002
      NODE_ENV: development
    ports:
      - "3003:3003"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      product-service:
        condition: service_started
    networks: [app-network]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: aks3tier-frontend
    ports:
      - "80:80"
    depends_on:
      - user-service
      - product-service
      - order-service
    networks: [app-network]
    restart: unless-stopped
